name: PR vehicle spend sync

on:
  schedule:
    # Every hour — keeps FM analytics close to live PR spend per vehicle
    - cron: "15 * * * *"
  workflow_dispatch:

jobs:
  sync:
    name: Sync vehicle PR spend into Fleet Hub
    runs-on: ubuntu-latest
    steps:
      - name: Call pr-spend sync endpoint
        env:
          HOST: ${{ secrets.EC2_HOST }}
          SYNC_KEY: ${{ secrets.DRAFT_CLEANUP_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${HOST:-}" ] || [ -z "${SYNC_KEY:-}" ]; then
            echo "::error::EC2_HOST and DRAFT_CLEANUP_SECRET secrets are required"
            exit 1
          fi

          call_url() {
            local url="$1"
            local status body
            body="$(curl -sS -X POST \
              -H "X-API-Key: ${SYNC_KEY}" \
              -H "Content-Type: application/json" \
              -d '{}' \
              --connect-timeout 8 --max-time 180 \
              -w '\n%{http_code}' "$url" || true)"
            status="$(echo "$body" | tail -n 1)"
            body="$(echo "$body" | sed '$d')"
            if [ "$status" = "200" ]; then
              echo "PR spend sync OK via ${url}"
              echo "$body"
              return 0
            fi
            echo "PR spend sync failed via ${url} (status: ${status})"
            echo "$body"
            return 1
          }

          if call_url "http://${HOST}/api/sync/pr-spend"; then
            exit 0
          elif call_url "http://${HOST}:3100/api/sync/pr-spend"; then
            exit 0
          else
            echo "::error::PR spend sync failed via both :80 and :3100"
            exit 1
          fi
