name: PR vehicle spend sync

on:
  schedule:
    # Every hour — keeps FM analytics close to live PR spend per vehicle
    - cron: "15 * * * *"
  workflow_dispatch:

jobs:
  sync:
    name: Sync vehicle PR spend into Fleet Hub
    runs-on: ubuntu-latest
    steps:
      - name: Call pr-spend sync endpoint
        env:
          SYNC_KEY: ${{ secrets.DRAFT_CLEANUP_SECRET }}
          FM_BASE: ${{ secrets.FLEET_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SYNC_KEY:-}" ]; then
            echo "::error::DRAFT_CLEANUP_SECRET secret is required"
            exit 1
          fi
          # Name-based vhost. The raw EC2 address on :80 is EHS, and :3100
          # is not reachable from GitHub.
          BASE="${FM_BASE:-https://fm.1pwrafrica.com}"
          BASE="${BASE%/}"

          call_url() {
            local url="$1"
            local status body
            body="$(curl -sS -X POST \
              -H "X-API-Key: ${SYNC_KEY}" \
              -H "Content-Type: application/json" \
              -d '{}' \
              --connect-timeout 8 --max-time 180 \
              -w '\n%{http_code}' "$url" || true)"
            status="$(echo "$body" | tail -n 1)"
            body="$(echo "$body" | sed '$d')"
            if [ "$status" = "200" ]; then
              echo "PR spend sync OK via ${url}"
              echo "$body"
              return 0
            fi
            echo "PR spend sync failed via ${url} (status: ${status})"
            echo "$body"
            return 1
          }

          if call_url "${BASE}/api/sync/pr-spend"; then
            exit 0
          fi
          echo "::error::PR spend sync failed via ${BASE}"
          exit 1
