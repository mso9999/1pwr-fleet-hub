name: Draft Cleanup

on:
  schedule:
    # Daily at 02:15 UTC
    - cron: "15 2 * * *"
  workflow_dispatch:

jobs:
  cleanup:
    name: Purge stale mission/trip drafts
    runs-on: ubuntu-latest
    steps:
      - name: Call cleanup endpoint
        env:
          CLEANUP_KEY: ${{ secrets.DRAFT_CLEANUP_SECRET }}
          FM_BASE: ${{ secrets.FLEET_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CLEANUP_KEY:-}" ]; then
            echo "::error::DRAFT_CLEANUP_SECRET secret is required"
            exit 1
          fi
          # Name-based vhost. The raw EC2 address on :80 is EHS, and :3100
          # is not reachable from GitHub.
          BASE="${FM_BASE:-https://fm.1pwrafrica.com}"
          BASE="${BASE%/}"

          call_url() {
            local url="$1"
            local status
            local body
            body="$(curl -sS -X POST \
              -H "X-API-Key: ${CLEANUP_KEY}" \
              --connect-timeout 8 --max-time 20 \
              -w '\n%{http_code}' "$url" || true)"
            status="$(echo "$body" | tail -n 1)"
            body="$(echo "$body" | sed '$d')"
            if [ "$status" = "200" ]; then
              echo "Cleanup OK via ${url}"
              echo "$body"
              return 0
            fi
            echo "Cleanup failed via ${url} (status: ${status})"
            echo "$body"
            return 1
          }

          if call_url "${BASE}/api/sync/cleanup-drafts"; then
            exit 0
          fi
          echo "::error::Draft cleanup failed via ${BASE}"
          exit 1
