name: Stale Work Order Nudge

on:
  schedule:
    # Weekdays 05:30 UTC = 07:30 SAST — lands at the start of the workday
    - cron: "30 5 * * 1-5"
  workflow_dispatch:

jobs:
  nudge:
    name: Nudge fleet team on stalled work orders
    runs-on: ubuntu-latest
    steps:
      - name: Call stale-WO nudge endpoint
        env:
          NUDGE_KEY: ${{ secrets.DRAFT_CLEANUP_SECRET }}
          FM_BASE: ${{ secrets.FLEET_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${NUDGE_KEY:-}" ]; then
            echo "::error::DRAFT_CLEANUP_SECRET secret is required"
            exit 1
          fi
          # Name-based vhost. The raw EC2 address on :80 is EHS, and :3100
          # is not reachable from GitHub.
          BASE="${FM_BASE:-https://fm.1pwrafrica.com}"
          BASE="${BASE%/}"

          call_url() {
            local url="$1"
            local status body
            body="$(curl -sS -X POST \
              -H "X-API-Key: ${NUDGE_KEY}" \
              -H "Content-Type: application/json" \
              -d '{}' \
              --connect-timeout 8 --max-time 30 \
              -w '\n%{http_code}' "$url" || true)"
            status="$(echo "$body" | tail -n 1)"
            body="$(echo "$body" | sed '$d')"
            if [ "$status" = "200" ]; then
              echo "Nudge OK via ${url}"
              echo "$body"
              return 0
            fi
            echo "Nudge failed via ${url} (status: ${status})"
            echo "$body"
            return 1
          }

          if call_url "${BASE}/api/sync/nudge-stale-work-orders"; then
            exit 0
          fi
          echo "::error::Stale WO nudge failed via ${BASE}"
          exit 1
