name: Stale approval timeout

on:
  schedule:
    # Daily 06:30 UTC = 08:30 SAST
    - cron: "30 6 * * *"
  workflow_dispatch:

jobs:
  timeout:
    name: Warn or reject unapproved requests
    runs-on: ubuntu-latest
    steps:
      - name: Call stale-approval endpoint
        env:
          CLEANUP_KEY: ${{ secrets.DRAFT_CLEANUP_SECRET }}
          FM_BASE: ${{ secrets.FLEET_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CLEANUP_KEY:-}" ]; then
            echo "::error::DRAFT_CLEANUP_SECRET secret is required"
            exit 1
          fi
          # Name-based vhost. The raw EC2 address on :80 is EHS, and :3100
          # is not reachable from GitHub.
          BASE="${FM_BASE:-https://fm.1pwrafrica.com}"
          BASE="${BASE%/}"

          call_url() {
            local url="$1"
            local status body
            body="$(curl -sS -X POST \
              -H "X-API-Key: ${CLEANUP_KEY}" \
              --connect-timeout 8 --max-time 60 \
              -w '\n%{http_code}' "$url" || true)"
            status="$(echo "$body" | tail -n 1)"
            body="$(echo "$body" | sed '$d')"
            if [ "$status" = "200" ]; then
              echo "Stale approval OK via ${url}"
              echo "$body"
              return 0
            fi
            echo "Stale approval failed via ${url} (status: ${status})"
            echo "$body"
            return 1
          }

          if call_url "${BASE}/api/sync/stale-approvals"; then
            exit 0
          fi
          echo "::error::Stale approval timeout failed via ${BASE}"
          exit 1
